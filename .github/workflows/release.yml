name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  checks:
    name: Gate the tag on a green suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy src
      - run: python -m pytest
      - run: python scripts/verify.py

  build:
    name: Build sdist and wheel
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  github-release:
    name: Publish the GitHub release
    runs-on: ubuntu-latest
    needs: build
    steps:
      # The release notes are read straight out of CHANGELOG.md, so this job
      # needs the repository itself, not just the built artifacts.
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          notes="$(awk '/^## /{if (found) exit; found=1; next} found && NF' CHANGELOG.md || true)"
          if [ -z "$notes" ]; then notes="See CHANGELOG.md."; fi
          gh release create "$tag" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$tag" \
            --notes "$notes"

  # Publish to PyPI as `agentci-py` (the `agentci` name is an unrelated product).
  # One-time setup, done in PyPI: create the `agentci-py` project and add a
  # trusted publisher for this repository (owner tejas-parjane, workflow
  # release.yml). No long-lived token is needed; pushes of `v*` tags that pass
  # the checks restart this job.
  pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write          # trusted publishing; no long-lived token
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
