[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "agentci-py"
dynamic = ["version"]
description = "Open-source CI and release gates for AI agents. Assert on outcomes, tool calls, execution traces, policy, cost, latency, and regressions."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "AgentCI Contributors" }]
keywords = [
    "ai",
    "agent",
    "agents",
    "llm",
    "testing",
    "ci",
    "evaluation",
    "observability",
    "policy",
    "release-gating",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.7,<3",
    "PyYAML>=6.0",
    "typer>=0.12",
    "rich>=13.7",
    "jsonschema>=4.21",
]

[project.optional-dependencies]
otel = ["opentelemetry-sdk>=1.24", "opentelemetry-exporter-otlp-proto-http>=1.24"]
judge = ["httpx>=0.27"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "build>=1.2",
]
docs = ["mkdocs-material>=9.5", "mkdocstrings[python]>=0.25"]

[project.urls]
Homepage = "https://github.com/tejas-parjane/agentci"
Repository = "https://github.com/tejas-parjane/agentci"
Issues = "https://github.com/tejas-parjane/agentci/issues"
Changelog = "https://github.com/tejas-parjane/agentci/blob/HEAD/CHANGELOG.md"

[project.scripts]
agentci = "agentci.cli:main"

[tool.hatch.version]
path = "src/agentci/__about__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/agentci"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/examples",
    "/docs",
    "/action",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = [".agentci", "site"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "N",
    "UP",
    "B",
    "A",
    "C4",
    "SIM",
    "RUF",
    "S",
    "PL",
    "ARG",
]
ignore = [
    "PLR0913", # too-many-arguments: assertions are inherently arg-heavy
    "S101",    # assert: pytest style asserts are the point
    "PLR2004", # magic-value: thresholds are the domain
    "E501",    # line-too-long: handled by the formatter

    # Deliberate deviations, each for a stated reason rather than convenience.
    "UP042",   # prefer-StrEnum: these enums serialise to JSON via `str` mixin.
    #            StrEnum would change `str(Status.PASS)` from "Status.PASS" to
    #            "pass", breaking every f-string and log line that reads better
    #            with the qualified name, and would drop 3.10 compat for no gain.
    "N818",    # exception-suffix: StepLimitExceeded / SideEffectBlocked read as
    #            conditions, not errors. "Error" would imply a fault in AgentCI.
    "S105",    # hardcoded-password-string: matches `PASS`/`FAIL` sentinels.
    "S607",    # start-process-with-partial-path: `git` must resolve from PATH so
    #            it works on a developer machine and inside CI alike.
    "PLR0911", # too-many-return-statements: guard-clause chains read better than
    #            a single branchy expression when classifying an error.
    "PLC0415", # import-outside-top-level: a few adapters import lazily to keep
    #            optional dependencies off the import path for `agentci test`.
    "RUF012",  # mutable-class-default: `tools = {...}` on an adapter class is the
    #            documented declaration style, not shared mutable state.
    "PLW0603", # global-statement: the example's flaky adapter needs a counter the
    #            test can reset.
    "RUF007",  # pairwise: handled where it matters (assertions/execution.py).
]

[tool.ruff.lint.per-file-ignores]
# AgentCI is a test harness: it must be able to reference secrets, side effects
# and bare asserts in fixtures without tripping its own linter. The posture is
# enforced for real instead -- tests/test_storage.py covers redaction and
# path traversal, and scripts/verify.py asserts that its credential-leak probe
# fails -- so no rule here needs to see a secret literal to know it is a secret.
"tests/**" = ["S", "PLR", "ARG", "B011"]
"examples/**" = ["S", "PLR", "ARG", "B011"]
# B008: typer's entire CLI design is `option: type = typer.Option(default)`.
# Refusing function-call defaults makes the declarative command signatures
# impossible to write. PLR0917: a command with that many options cannot also
# keep its positional argument count under five without becoming unreadable.
"src/agentci/cli.py" = ["B008", "PLR0917"]

[tool.ruff.lint.isort]
known-first-party = ["agentci"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
disallow_any_explicit = false
show_error_codes = true
files = ["src/agentci"]
exclude = ["^src/agentci/replay/mock\\.py$"]

[[tool.mypy.overrides]]
module = ["yaml", "jsonschema.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# `tests/agentci/` holds AgentCI's own example suite: files decorated with
# @agent_test whose functions take an injected `agent`, not pytest fixtures.
# They are executed by `agentci run` / scripts/verify.py, so collecting them here
# would fail every one of them with a missing-fixture error.
norecursedirs = ["agentci", ".agentci", ".venv", "build", "dist"]
addopts = [
    "-q",
    "--strict-markers",
    "--strict-config",
    # Keep tmp_path fixtures inside the repo. The system temp directory is not
    # reliably writable (notably on Windows), and a basetemp outside the project
    # would leak test artifacts into wherever the runner happens to point it.
    "--basetemp=.pytest_tmp",
]
filterwarnings = ["error", "ignore::DeprecationWarning:jsonschema.*"]

[tool.coverage.run]
source = ["src/agentci"]
branch = true
omit = ["*/__about__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]